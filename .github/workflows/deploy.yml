# ============================================================================
# MakeTicket CD Pipeline — Backend Deploy to Render
# Runs on: push to main branch (after CI passes)
# 
# Frontend deploys automatically via Vercel Git integration — no workflow needed.
# ============================================================================

name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      # Only deploy when backend code actually changes
      - 'backend/**'
      - '.github/workflows/deploy.yml'

# Prevent concurrent deployments
concurrency:
  group: deploy-production
  cancel-in-progress: false # Don't cancel in-progress deploys

jobs:
  # Wait for CI to pass first
  ci-check:
    name: Verify CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Typecheck
        run: npm run typecheck
        working-directory: backend

      - name: Build
        run: npm run build
        working-directory: backend

      - name: Run tests
        run: npm test -- --ci --forceExit --detectOpenHandles
        working-directory: backend
        env:
          NODE_ENV: test
          JWT_SECRET: test_ci_secret_do_not_use_in_prod
          RAZORPAY_WEBHOOK_SECRET: test_webhook_secret
          ENCRYPTION_KEY: 01234567890123456789012345678901

  # Deploy to Render via Deploy Hook
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: ci-check
    environment: production

    steps:
      - name: Trigger Render Deploy
        run: |
          echo "🚀 Triggering Render deployment..."
          curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo ""
          echo "✅ Deploy hook triggered. Check Render dashboard for status."

      # Alternative: If using Render API instead of deploy hooks
      # - name: Deploy via Render API
      #   run: |
      #     curl -s -X POST \
      #       "https://api.render.com/v1/services/${{ secrets.RENDER_SERVICE_ID }}/deploys" \
      #       -H "Authorization: Bearer ${{ secrets.RENDER_API_KEY }}" \
      #       -H "Content-Type: application/json" \
      #       -d '{"clearCache": "do_not_clear"}'

      - name: Post-deploy health check
        run: |
          echo "⏳ Waiting 60 seconds for deployment to start..."
          sleep 60

          echo "🏥 Checking backend health..."
          MAX_RETRIES=10
          RETRY_DELAY=15

          for i in $(seq 1 $MAX_RETRIES); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
              "${{ secrets.BACKEND_URL }}/health" || echo "000")

            if [ "$STATUS" = "200" ]; then
              echo "✅ Backend is healthy! (attempt $i)"
              exit 0
            fi

            echo "⏳ Health check attempt $i/$MAX_RETRIES returned $STATUS. Retrying in ${RETRY_DELAY}s..."
            sleep $RETRY_DELAY
          done

          echo "❌ Backend health check failed after $MAX_RETRIES attempts"
          exit 1
